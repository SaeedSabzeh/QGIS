name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check core scripts tests plugin
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_plugin.py
      - run: python scripts/check_plugin_zip.py dist/norme_milano.zip
      - uses: actions/upload-artifact@v4
        with:
          name: norme_milano-zip
          path: dist/norme_milano-*.zip
          if-no-files-found: error
