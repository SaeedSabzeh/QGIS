- id: q36
  question: "Cosa e' vietato nelle superfici boscate del Parco Agricolo Sud?"
  lang: it
  point: null
  gold_articles: ["PTC-art-21"]
  answer_key:
    - "any new construction is forbidden inside wooded areas"
    - "for existing buildings only protection and conservation works are allowed, with no increase in volume or covered area"
    - "the rules cover woodland, patches, tree belts and rows, and areas of spontaneous regeneration, which owners must keep in the best state of conservation"
