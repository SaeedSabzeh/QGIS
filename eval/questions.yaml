# ---------------------------------------------------------------- Documento di Piano (3)
- id: q31
  question: "What is the purpose of urban equalisation (perequazione) in the Documento di Piano and how do landowners share in it?"
  lang: en
  point: null
  gold_articles: ["DP-art-2"]
  acceptable_articles: ["PR-art-7"]
  answer_key:
    - "it is a tool of fairness among the parties in distributing the benefits, opportunities and burdens of urban transformation"
    - "it serves the free acquisition by the Comune of areas for public facilities foreseen by the Piano dei Servizi"
    - "owners take part proportionally to the properties they hold, regardless of the specific use assigned to their areas"
  type: definition

- id: q32
  question: "A quali interventi si applicano i principi di invarianza idraulica e idrologica?"
  lang: it
  point: null
  gold_articles: ["DP-art-6"]
  answer_key:
    - "the principle of hydraulic and hydrological invariance must be respected in planning choices"
    - "it applies to building interventions in art. 3 comma 1 letters d), e), f) of D.P.R. 380/2001 (renovation, new construction, urban restructuring)"
    - "and to all interventions that reduce soil permeability compared with the condition before urbanisation"
  type: rule

- id: q33
  question: "Come devono essere trascritti i contratti di cessione dei diritti edificatori e dove vengono annotati?"
  lang: it
  point: null
  gold_articles: ["DP-art-7"]
  acceptable_articles: ["PR-art-7"]
  answer_key:
    - "contracts must be in the form of a public deed or a private writing with authenticated signatures"
    - "they must be recorded in the Real Estate Registers under art. 2643 comma 2-bis of the Civil Code"
    - "they are annotated in the public Registro delle Cessioni dei Diritti Edificatori (art. 11 L.R. 12/2005)"
  type: procedure

# ---------------------------------------------------------------- PTC Parco Sud (3)
