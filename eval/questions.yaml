- id: q35
  question: "Posso eliminare una marcita nel Parco Agricolo Sud? Come funziona la tutela?"
  lang: it
  point: [45.4170, 9.2350]
  gold_articles: ["PTC-art-44"]
  answer_key:
    - "all the marcite and prati marcitori of the park are protected for their historical, landscape and naturalistic value"
    - "marcite can be removed only with prior authorisation of the park managing body"
    - "the authorisation is given after hearing the technical-agronomic opinion of the competent service of the Province of Milan"
