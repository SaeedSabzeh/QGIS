# ---------------------------------------------------------------- Cross-document (2)
- id: q37
  question: "I want to build a new farm building near Chiaravalle, inside the Parco Agricolo Sud. Which text prevails, the Piano delle Regole or the park's PTC?"
  lang: en
  point: [45.4170, 9.2350]
  gold_articles: ["PR-art-35", "PTC-art-25"]
  acceptable_articles: ["PS-art-12", "PTC-art-1", "PR-art-25"]
  answer_key:
    - "inside the Parco Agricolo Sud Milano the PTC contents are incorporated in the PGT and prevail over conflicting provisions"
    - "agricultural belt territories (cintura metropolitana) are destined to agricultural-productive functions and must be kept intact and compact"
    - "the PTC text in the corpus is the 2000 version without later amendments"
  type: cross

- id: q38
  question: "Dentro il Parco Agricolo Sud, posso costruire a 50 metri da un Naviglio? Cosa dicono il PTC e il Piano delle Regole?"
  lang: it
  point: null
  gold_articles: ["PTC-art-42", "PR-art-50"]
  acceptable_articles: ["PR-art-35", "PTC-art-1"]
  answer_key:
    - "no: the PTC forbids building within 100 m of the banks of Navigli pending the sector plan"
    - "the Piano delle Regole subjects the water network to specific hydraulic and environmental protection, with respect strips where new building is forbidden on the main network"
    - "inside the park the PTC prevails over PGT provisions that conflict"
  type: cross

