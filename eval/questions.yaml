  question: "Within what distance from the banks of a Naviglio is building forbidden in the Parco Agricolo Sud?"
  lang: en
  point: null
  gold_articles: ["PTC-art-42"]
  answer_key:
    - "building is forbidden in a strip of 100 m from the banks of Navigli and canals"
    - "this holds pending a sector plan for navigli and canals under art. 7 that defines their area of relevance in more detail"
