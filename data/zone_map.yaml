# PGT category (regional layer tav_previsioni_b) -> articles of the PGT documents that govern it.
# Built by reading data/articles.json (corpus of scripts/build_corpus.py; registry in
# data/documents.json): PR Piano delle Regole, PS Piano dei Servizi, DP Documento di Piano,
# PTC Parco Agricolo Sud Milano, CG geological norms, CGS seismic annex, DPA1 landscape annex.
#
# Conventions
#   articles              ids of the records that directly govern the category (verified in the text)
#   general_articles      ids that apply on top (general or transitional rules)
#   explanatory_articles  ids of NON-normative text that explains the category (e.g. DPA1 sections);
#                         never present them as the rule
#   candidate_articles    plausible but not confirmed by the text alone (see verify)
#   why                   short justification quoting the article titles
#   note                  what lives in another PGT document, or limits of the mapping
#   verify: true          a human should confirm before the plugin states it as fact
# Ids are "<DOC>-art-N" (PR, PS, DP, PTC, CG), "<DOC>-sec-N" (CGS, DPA1) or "PTC-all-A". A bare
# number is read as PR-art-N. Every id below must exist in data/articles.json (tests/test_parse_nta.py).

sources:
  - {doc: PR, title: "Piano delle Regole – Norme di attuazione", version_date: "2025-12-04"}
  - {doc: PS, title: "Piano dei Servizi – Norme di attuazione", version_date: "2022-12-19"}
  - {doc: DP, title: "Documento di Piano – Norme di attuazione", version_date: "2019-10-14"}
  - {doc: PTC, title: "Parco Agricolo Sud Milano – PTC, NTA (DGR 7/818 of 2000, without later amendments)", version_date: "2000-08-03"}
  - {doc: CG, title: "Componente geologica – norme geologiche di piano", version_date: "2020-02-05"}
  - {doc: CGS, title: "Componente sismica – Allegato 7", version_date: "2020-02-05"}
  - {doc: DPA1, title: "Documento di Piano – Allegato 1, contenuti paesaggistici (explanatory)", version_date: "2019-10-14"}
layer_service: "tav_previsioni_b (Regione Lombardia, MapServer arcgis1/territorio)"

layers:
  naf:
    layer_id: 12
    field: COD_NUC
    description: "Nuclei di antica formazione (NAF)"
    articles: [PR-art-18, PR-art-19]
    general_articles: [PR-art-6, PR-art-8, PR-art-13]
    why: >-
      Capo IV "Nuclei di antica formazione": art. 18 "Definizione", art. 19 "Disciplina".
      NAF are part of the TUC (art. 2 c.2 a.i), so art. 6 "Indice di edificabilità
      territoriale", art. 8 "Disciplina delle destinazioni d'uso e loro mutamenti" and
      art. 13 "Attuazione del Piano" (c.3 b iii: NAF interventions need a convenzione) apply too.
    note: "COD_NUC is a code only; the NTA does not list NAF codes, so any value in this layer maps to art. 18-19."

  tuc:
    layer_id: 20
    fields: [AMB_URB, COD_DEST1]
    description: "Ambiti del tessuto urbano consolidato (TUC)"
    articles: [PR-art-6, PR-art-8, PR-art-13, PS-art-11]
    general_articles: [PR-art-5, PR-art-7, PR-art-9, PR-art-10, PR-art-12, PR-art-17]
    candidate_articles: [PR-art-18, PR-art-19, PR-art-20, PR-art-21, PR-art-22, PR-art-23]
    why: >-
      Rules for the whole TUC: art. 6 "Indice di edificabilità territoriale", art. 8
      "Disciplina delle destinazioni d'uso e loro mutamenti", art. 13 "Attuazione del Piano".
      Art. 5 c.15 defines the "Funzioni urbane" (the COD_DEST1 categories); art. 7
      "Perequazione e compensazione urbanistica", art. 9 "Edilizia Residenziale Sociale",
      art. 10 "Sostenibilità ambientale e resilienza urbana", art. 12 "Parcheggi privati",
      art. 17 "Criteri di densità, accessibilità" complete the general regime. The service
      requirement on new building and changes of use is in the Piano dei Servizi: art. 11
      "Dotazione di servizi nel Tessuto Urbano Consolidato" (c.1-3: territorial service provision
      due per functional category; PR art. 8 c.2-3 refers to it).
      Candidates: NAF art. 18-19, "Ambiti contraddistinti da un Disegno Urbano Riconoscibile"
      art. 20-21, "Ambiti di Rinnovamento Urbano" art. 22-23.
    note: >-
      The AMB_URB value (e.g. 23, card AU_23) is a regional code that the NTA never mentions,
      so the morphological sub-type (NAF / ADR / ARU) cannot be derived from it with certainty;
      the finer zone is drawn in Tav. R.02/R.03 of the Piano delle Regole, which the layer does
      not expose. The plugin should show the general articles and offer the candidates.
    verify: true
    by_value:
      COD_DEST1:
        "100":
          label: "RESIDENZIALE"
          articles: [PR-art-5, PR-art-8]
          why: 'Art. 5 c.15 a. "residenziale" is a "Funzione urbana"; art. 8 c.1 says urban functions are freely insertable in the TUC.'

  at:
    layer_id: 13
    field: AMB_TRAS
    description: "Ambiti di trasformazione"
    general_articles: [PR-art-1, PR-art-3, PR-art-35, PR-art-52, PR-art-53, DP-art-1, DP-art-2]
    why: >-
      No article of the Piano delle Regole, Piano dei Servizi, Documento di Piano norms, PTC or
      geological norms disciplines the "ambiti di trasformazione" themselves (text searched).
      PR art. 1 c.3 "Ambito di applicazione" excludes areas under other provisions; PR art. 3
      "Rapporti con gli altri strumenti di pianificazione" and PR art. 35 "Definizione e
      disciplina" (parks: the Parco Agricolo Sud Milano PTC prevails), like DP art. 1 c.5 b.
      "Caratteri ed elaborati costitutivi del Documento di Piano", matter where the area is
      inside a park; DP art. 2 "Perequazione urbanistica – principi generali" sets the
      perequation principles for the transformations regulated by the Documento di Piano; PR
      art. 52 "Disciplina degli ambiti interessati da provvedimenti approvati e adottati" and
      art. 53 "Norme finali" are the transitional rules.
    note: >-
      The rules of the single trasformazione areas are in the Documento di Piano (schede degli
      ambiti di trasformazione, in the Relazione generale, which is not in the corpus). The
      listed articles are NOT the governing discipline of the area; only the two PCU values below
      have a verified governing text, in the park's PTC.
    verify: true
    by_value:
      AMB_TRAS:
        "26":
          articles: [PTC-art-26, PTC-all-A]
          why: >-
            NOME_AMB "L'Idroscalo (PCU4)": PCU = Piano di Cintura Urbana. PTC art. 26 "Territori
            agricoli e verde di cintura urbana – ambito dei piani di cintura urbana" governs the
            comparti perimetered for the piani di cintura urbana; PTC Allegato A "Comparto 4:
            Parco est «Idroscalo»" gives the orientamenti e indirizzi for it.
          note: >-
            The match PCU4 = PTC comparto 4 rests on the name ("Idroscalo") and the number; the
            transformation area is not described as such in the PTC. PTC text of 2000 without
            the later amendments. Inside the park the PTC prevails (PR art. 35 c.1, PS art. 12).
          verify: true
        "29":
          articles: [PTC-art-26, PTC-all-A]
          why: >-
            NOME_AMB "Le Abbazie (PCU3)": PCU = Piano di Cintura Urbana. PTC art. 26 governs the
            comparti of the piani di cintura urbana; PTC Allegato A "Comparto 3: Parco delle
            Abbazie «L'agricoltura in città»" (sub-comparti Selvanesco, Chiaravalle - Macconago)
            gives the orientamenti e indirizzi for it.
          note: >-
            The match PCU3 = PTC comparto 3 rests on the name ("Abbazie") and the number. PTC
            text of 2000 without the later amendments. Inside the park the PTC prevails (PR art.
            35 c.1, PS art. 12).
          verify: true

  rigenerazione:
    layer_id: 14
    fields: [CATEGORIA, NOME_AMB]
    description: "Ambiti di rigenerazione urbana e territoriale"
    articles: [PR-art-14, PR-art-15, DP-art-3]
    general_articles: [PR-art-16, PR-art-22, PR-art-23, DP-art-4]
    why: >-
      Titolo II Capo I "Rigenerazione": art. 14 "Definizione", art. 15 "Disciplina"
      (c.2 Ambiti di Rinnovamento Urbano, c.3 Rigenerazione Ambientale, c.4 Piazze, c.5 Nodi di
      interscambio, c.6 Nuclei storici esterni e Spazi a vocazione pedonale). GFU areas follow
      art. 16 "Grandi Funzioni Urbane"; ARU follow art. 22 "Definizione" and art. 23 "Disciplina".
      DP art. 3 "Individuazione degli ambiti oggetto di Rigenerazione" says the ambiti are
      identified in Tav. D.01 and disciplined by PR art. 14, 15 and 16; DP art. 4 "Individuazione
      delle Grandi Funzioni Urbane" does the same for the GFU (PR art. 16).
    note: >-
      Art. 14 says criteria and objectives are specified by the Documento di Piano. The CATEGORIA
      values were not seen at the Phase 0 test points, so the value-to-comma mapping
      (which c. of art. 15) is unconfirmed.
    verify: true

  servizi:
    layer_id: 18
    fields: [TIPO_SERV, STATO, LIV_TER]
    description: "Servizi e impianti"
    articles: [PS-art-7, PS-art-8]
    general_articles: [PS-art-4, PS-art-5, PS-art-6, PS-art-11, PS-art-12, PR-art-1, PR-art-6, PR-art-7, PR-art-8, PR-art-53]
    candidate_articles: [PS-art-9]
    why: >-
      The Piano dei Servizi governs the services: PS art. 7 "Individuazione e disciplina dei
      servizi localizzati esistenti" (existing services identified in Tav. S.01 and the NIL are
      confirmed in their destination) and PS art. 8 "Individuazione e disciplina dei servizi
      localizzati esistenti e di nuova previsione" (verde urbano, infrastrutture, pertinenze
      indirette, edilizia residenziale sociale). PS art. 4 "Definizioni", art. 5 "Catalogo dei
      servizi" and art. 6 "Categorie dei servizi" give the definitions; PS art. 11 "Dotazione di
      servizi nel Tessuto Urbano Consolidato" sets the service provision due on interventions;
      PS art. 12 says the PTC prevails inside the Parco Agricolo Sud Milano. PS art. 9 covers
      the "servizi da localizzare" (candidate: it applies only to planned services). PR art. 1
      c.3 a. "Ambito di applicazione" excludes "le aree e gli interventi disciplinati dal Piano
      dei Servizi" from the Piano delle Regole; only interfaces are in the PR: art. 6 "Indice di
      edificabilità territoriale" (IT unico on pertinenze indirette from Tav. S.02), art. 7
      "Perequazione e compensazione urbanistica", art. 8 (c.2-3, service requirement on change
      of use, referring to PS art. 11) and art. 53 "Norme finali" (c.5 existing public-interest
      services).
    note: >-
      STATO and TIPO_SERV values were seen only at one Phase 0 point (existing "Aree a verde"),
      so the choice between PS art. 7/8 (existing / localizzati) and PS art. 9 (da localizzare)
      is not driven by STATO yet. The Catalogo dei servizi table that follows PS art. 14 in the
      PDF is not in the corpus.
    verify: true

  agricole:
    layer_id: 19
    fields: [COD_AGR, SPEC_AGR]
    description: "Aree agricole"
    articles: [PR-art-24, PR-art-25]
    general_articles: [PR-art-6, PR-art-34, PR-art-35]
    candidate_articles: [PTC-art-25, PTC-art-15, PTC-art-26]
    why: >-
      Titolo II Capo VII "Aree destinate all'agricoltura": art. 24 "Individuazione", art. 25
      "Disciplina". Art. 6 c.1 excludes agricultural areas from the IT unico; art. 34
      "Definizione e disciplina" c.3 covers "Ambiti agricoli di rilevanza paesaggistica";
      art. 35 applies inside Parco Agricolo Sud / Parco Nord. Inside the Parco Agricolo Sud
      Milano the PTC prevails (PR art. 35 c.1; PS art. 12; DP art. 1 c.5 b.): PTC art. 25
      "Territori agricoli di cintura metropolitana" (c.1: destined to agricultural functions)
      and art. 15 "Norme generali di tutela dell'attività agricola" would then govern; PTC art.
      26 "Territori agricoli e verde di cintura urbana" applies in the cintura urbana comparti.
    note: >-
      The agricole layer does not say whether the point is inside the Parco Agricolo Sud Milano,
      so the PTC articles are candidates: use them only where the park perimeter applies. Art. 25
      refers to LR 12/2005 title III part II and the PTCP for the detailed agricultural rules.
      The PTC text is the one of DGR 7/818 of 2000, without the later NTA amendments.

  paesaggio:
    layer_id: 21
    fields: [COD_PAES, TIPO_AMB, DESCRIZION]
    description: "Aree di valore paesaggistico-ambientale ed ecologico"
    articles: [PR-art-34]
    general_articles: [PR-art-2, PR-art-24, PR-art-35, PR-art-36]
    candidate_articles: [PTC-art-16, PTC-art-34]
    why: >-
      Art. 2 c.2 e. says the Piano delle Regole "individua e disciplina le aree di valore
      paesaggistico-ambientale ed ecologico". The only article with landscape-area rules is
      art. 34 "Definizione e disciplina" (aree di valorizzazione ambientale, Allegato 1).
      Related: art. 24 "Individuazione" (agricultural areas with environmental function),
      art. 35 (parks), art. 36 "Beni ed aree soggette a tutele sovraordinate e a piani di settori".
      Inside the Parco Agricolo Sud Milano (PTC prevails, PR art. 35 c.1) the PTC has PTC art. 16
      "Norme generali di tutela ambientale-paesaggistica" and PTC art. 34 "Zona di tutela e
      valorizzazione paesistica" (c.1: territori agricoli del parco not subject to a piano di
      cintura urbana).
    note: >-
      The layer's TIPO_AMB codes (e.g. 502 traditional agrarian landscape) are not listed in the
      NTA; the match to art. 34 and its Allegato 1 is by subject, not by code. The PTC articles
      are candidates: they apply only inside the park perimeter, which this layer does not give.
    verify: true

  sensibilita:
    layer_id: 22
    fields: [COD_SEN, CLASSE]
    description: "Classi di sensibilità paesistica (CLASSE 1-5)"
    articles: [PR-art-34]
    general_articles: [PR-art-4, PR-art-13]
    explanatory_articles: [DPA1-sec-21, DPA1-sec-22]
    why: >-
      Art. 34 c.2 (Aree di valorizzazione, "Definizione e disciplina"): the areas are divided
      into sensitivity classes shown in Allegato 1 "ai fini della sottoposizione degli interventi
      edilizi al parere della Commissione per il Paesaggio". Art. 4 c.2 a. lists "Allegato 1 -
      Carta della sensibilità paesaggistica dei luoghi"; art. 13 "Attuazione del Piano" requires
      the Commissione's opinion in some cases. The classes are explained (not governed) in the
      Documento di Piano Allegato 1 "Contenuti paesaggistici": sez. 9.1 "Definizione dei livelli
      di sensibilità" (1 molto bassa, 2 bassa, 3 media, 4 alta, 5 molto alta) and sez. 9.2
      "Criteri applicativi".
    note: >-
      The NTA does not say what each class 1-5 requires. DPA1 sez. 9.2 gives only an example
      ("Puramente a titolo di esempio") of how the review could be graduated; it is a
      non-normative report, so present it as explanation, not as the rule.
    by_value:
      CLASSE:
        "1":
          articles: [PR-art-34]
          note: >-
            DPA1 sez. 9.1: classe 1 = "Sensibilità paesistica molto bassa". Example in sez. 9.2
            (non-binding): classi 1 e 2, relazione sugli esiti paesaggistici a cura del progettista per i Piani Attuativi.
        "2":
          articles: [PR-art-34]
          note: >-
            DPA1 sez. 9.1: classe 2 = "Sensibilità paesistica bassa". Example in sez. 9.2
            (non-binding): classi 1 e 2, relazione sugli esiti paesaggistici a cura del progettista per i Piani Attuativi.
        "3":
          articles: [PR-art-34]
          note: >-
            DPA1 sez. 9.1: classe 3 = "Sensibilità paesistica media". Example in sez. 9.2
            (non-binding): classe 3, relazione del progettista per gli interventi che comportano trasformazioni e esame dei Permessi di Costruire e dei Piani Attuativi da parte della Commissione per il Paesaggio.
        "4":
          articles: [PR-art-34]
          note: >-
            DPA1 sez. 9.1: classe 4 = "Sensibilità paesistica alta". Example in sez. 9.2
            (non-binding): classi 4 e 5, ogni intervento soggetto a SCIA, PdC e Piano Attuativo con relazione paesaggistica e parere della Commissione per il Paesaggio.
        "5":
          articles: [PR-art-34]
          note: >-
            DPA1 sez. 9.1: classe 5 = "Sensibilità paesistica molto alta". Example in sez. 9.2
            (non-binding): classi 4 e 5, ogni intervento soggetto a SCIA, PdC e Piano Attuativo con relazione paesaggistica e parere della Commissione per il Paesaggio.
    verify: true

  fattibilita_geologica:
    layer_id: 3
    field: CLASSE
    description: "Fattibilità geologica (Componente geologica PGT)"
    general_articles: [PR-art-42, PR-art-43, PR-art-47, PR-art-48, CG-art-47, CGS-sec-1, CGS-sec-2]
    why: >-
      Titolo IV Capo V "Componente geologica, idrogeologica e sismica": art. 42 "Definizione e
      disciplina", art. 43 "Classi di fattibilità geologica", art. 47 "Pericolosità sismica e
      microzonazione", art. 48 "Documento semplificato del rischio idraulico". The geological
      norms annex (CG) reproduces PR art. 42-51 as of 2020 (CG-art-N = PR-art-N); where the two
      differ the current PR text prevails (the 2025 PR adds rules for the torrente Seveso in
      art. 43-46). The seismic annex (CGS) has the two sections behind PR art. 47: soil category
      of foundation (sez. 1.1) and liquefaction analysis, zones Z2b (sez. 1.2).
    note: >-
      Sub-classes (IIIa-IIIe, IVa-IVc) come from DESCR_FATTIBILITA / FATTORI_PERICOLO, e.g.
      Chiaravalle "IIIc+IIId". Class 1 is not defined in the NTA. The NTA says maps are Tav. R.01
      and Tav. G.17 (art. 43).
    by_value:
      CLASSE:
        "2":
          articles: [PR-art-44]
          general_articles: [PR-art-43, CG-art-44]
          why: 'Art. 44 "Classe II - Fattibilità con modeste limitazioni".'
        "3":
          articles: [PR-art-45]
          general_articles: [PR-art-43, CG-art-45]
          why: 'Art. 45 "Classe III - Fattibilità con consistenti limitazioni" (IIIa-IIIe).'
        "4":
          articles: [PR-art-46]
          general_articles: [PR-art-43, CG-art-46]
          why: 'Art. 46 "Classe IV - Fattibilità con gravi limitazioni" (IVa-IVc).'
        "1":
          verify: true
          note: "Class I is not described in this NTA."
