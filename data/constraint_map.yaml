# Constraint layer -> PGT articles that mention/apply, the higher-level rule (EXTERNAL, not in
# the PGT norms) and a plain one-line note. Built by reading data/articles.json (PR Piano delle
# Regole text of 04/12/2025, CG geological norms of 2020; see data/documents.json).
#
#   articles       ids ("PR-art-N", "CG-art-N", ...) that genuinely refer to the constraint
#                  (verified in the text); a bare number is read as PR-art-N
#   external_rule  rule that lives OUTSIDE this document; kept apart on purpose, never cite
#                  it as an NTA article
#   verify: true   uncertain, needs human confirmation

sources:
  - {doc: PR, title: "Piano delle Regole – Norme di attuazione", version_date: "2025-12-04"}
  - {doc: PTC, title: "Parco Agricolo Sud Milano – PTC, NTA (DGR 7/818 of 2000; amendments 2007 and 2009 are local, outside Milan)", version_date: "2000-08-03"}
  - {doc: CG, title: "Componente geologica – norme geologiche di piano", version_date: "2020-02-05"}

constraints:
  natura2000_zsc_sic:
    service: "Rete_Natura_2000 layer 0 (COD_SITO)"
    articles: [PR-art-3, PR-art-36]
    why: >-
      No article of this NTA mentions Natura 2000, ZSC, SIC, ZPS or valutazione di incidenza
      (text searched). Only generic hooks: art. 3 c.1 a. "Rapporti con gli altri strumenti di
      pianificazione e programmazione sovraordinata" (the PdR "recepisce le prescrizioni" of
      superordinate plans) and art. 36 "Beni ed aree soggette a tutele sovraordinate e a piani
      di settori".
    external_rule:
      text: "Valutazione di incidenza: DPR 357/1997 art. 5 (transposing Habitats Directive 92/43/EEC art. 6)."
      external: true
      verify: true
    note: "A site hit means works inside or near it need a valutazione di incidenza; the Milan NTA adds no rule of its own."
    verify: true

  natura2000_zps:
    service: "Rete_Natura_2000 layer 1 (COD_ZPS)"
    articles: [PR-art-3, PR-art-36]
    why: "As for ZSC/SIC: the NTA has no Natura 2000 text; only art. 3 and art. 36 are generic hooks."
    external_rule:
      text: "Valutazione di incidenza: DPR 357/1997 art. 5; Birds Directive 2009/147/EC for ZPS."
      external: true
      verify: true
    note: "ZPS (bird protection areas) trigger the same valutazione di incidenza procedure; no Milan-specific rule in the NTA."
    verify: true

  parco_regionale:
    service: "AreeProtette layer 9 \"Parchi regionali\" (NOME_PA, NOME_ENTE, DATTUA_PA)"
    articles: [PR-art-35]
    why: >-
      PR art. 35 "Definizione e disciplina" c.1: inside the perimeters of the regional parks the
      zoning and implementing rules of the park's PTC apply; the PTC contents are "recepiti di
      diritto nel PGT e prevalgono su previsioni difformi".
    note: >-
      KNOWN GAP: Parco Nord Milano does not appear in this layer (no hit even at its centre), so
      a point inside Parco Nord gets no park finding from the map service; PR art. 35 c.1-2
      names it and the Parco Nord PTC is not in the corpus.
    unmatched_note: "The PTC of this park is not in the corpus: only PR art. 35 is cited; consult the park's own PTC."
    verify: true
    by_value:
      NOME_PA:
        "Parco Agricolo Sud Milano":
          articles: [PTC-art-1]
          general_articles: [PTC-art-24, PTC-art-12]
          why: >-
            PTC art. 1 c.5: the PTC's urban-planning provisions are "immediatamente vincolanti per
            chiunque", are incorporated by right in the municipal general plans and replace
            conflicting provisions. PTC art. 24 "Articolazione del territorio del parco" divides
            the park into territori (art. 25 cintura metropolitana, art. 26 cintura urbana, art.
            27 collegamento citta-campagna); which zone and rule apply at the point depends on
            the PTC zoning maps (Tav. A, not in the corpus). PTC art. 12 covers the opinions and
            authorisations of the park authority (ente gestore).
          note: >-
            PTC text is DGR 7/818 of 03/08/2000. The two later amendments (DGR 8/4516 of 2007,
            Tav. 26 at Colturano; DGR 8/10833 of 2009, new art. 30 bis, fontanile Rile at
            Settala) were checked and are local changes outside Milan: the 2000 text is current
            for Milan. The zone-specific PTC articles stay candidates on the PGT findings until
            the PTC zoning at the point is checked. Annexes A-D of the PTC are not in the corpus.

  pgra_hazard:
    service: "direttiva_alluvioni_2022 layers 17-27 (Codscenar H/M/L, Tritorno)"
    articles: [PR-art-43, PR-art-44, PR-art-45, PR-art-46, CG-art-43, CG-art-44, CG-art-45, CG-art-46]
    why: >-
      Art. 43 "Classi di fattibilità geologica" says the classes are integrated with the PAI and
      PGRA hazard limits. The NTA names PGRA scenarios P1/P2/P3 (not H/M/L): P3 "frequente;
      tempo di ritorno inferiore o uguale a 10 anni" (art. 45), P2 "poco frequente" (art. 45),
      P1 "rara" (art. 44). P1 -> art. 44 (class II); P2/P3 -> art. 45 (classes IIIa/IIIb, c.3-4)
      and art. 46 (class IVa, outside the built-up area).
      CG-art-43 to CG-art-46 (geological norms annex, 2020) reproduce the same articles; where
      they differ the current PR text prevails (the 2025 PR adds torrente Seveso rules in art.
      43-46).
    hazard_mapping:
      H: {nta_scenario: P3, articles: [PR-art-45, PR-art-46, CG-art-45, CG-art-46]}
      M: {nta_scenario: P2, articles: [PR-art-44, PR-art-45, PR-art-46, CG-art-44, CG-art-45, CG-art-46]}
      L: {nta_scenario: P1, articles: [PR-art-44, CG-art-44]}
    hazard_mapping_note: >-
      H/M/L = P3/P2/P1 is the standard PGRA convention and matches the return periods in art.
      45 and the Lambro features (Tritorno 10, 200, 500), but the NTA itself never writes H/M/L.
      Which class applies at a point depends on the Milan fattibilità class, not on the PGRA
      scenario alone.
    external_rule:
      text: "PAI / PGRA norms: Norme di Attuazione del PAI (Po basin authority), Title V, integrated with the PGRA (Directive 2007/60/EC, D.Lgs. 49/2010); Lombardy implementation in DGR X/6738 of 19/06/2017."
      external: true
      verify: true
    note: "Flood hazard from the PGRA maps reinforces the geological feasibility class (III/IV) and may require a hydraulic compatibility study."
    verify: true

  pgra_risk:
    service: "direttiva_alluvioni_2022 layers 12-15 (Ris R1-R4)"
    articles: [PR-art-43, PR-art-45, PR-art-46, PR-art-48]
    why: >-
      The NTA does not use the R1-R4 risk classes (text searched). It addresses flood risk
      through the hazard-based classes (art. 45 "Classe III", art. 46 "Classe IV") and art. 48
      "Documento semplificato del rischio idraulico" (DSRI, RR 7/2017).
    external_rule:
      text: "PGRA risk maps R1-R4 (Directive 2007/60/EC, D.Lgs. 49/2010); PAI/PGRA norms as above."
      external: true
      verify: true
    note: "R1 (moderate) to R4 (very high) describe damage potential; the NTA reacts to hazard and the geological class, not to R-class."
    verify: true

  geologia:
    service: "tav_previsioni_b layer 3 (CLASSE)"
    articles: [PR-art-42, PR-art-43, PR-art-44, PR-art-45, PR-art-46, PR-art-47, PR-art-48]
    why: >-
      Titolo IV Capo V "Componente geologica, idrogeologica e sismica": art. 42, 43 "Classi di
      fattibilità geologica", 44 "Classe II", 45 "Classe III", 46 "Classe IV", 47 "Pericolosità
      sismica e microzonazione", 48 "Documento semplificato del rischio idraulico".
    classes:
      II: {articles: [PR-art-44], note: "Modest limitations (art. 44)."}
      III: {articles: [PR-art-45], note: "Considerable limitations, sub-classes IIIa-IIIe (art. 45)."}
      IV: {articles: [PR-art-46], note: "Serious limitations, sub-classes IVa-IVc; new building generally not allowed (art. 46 c.1)."}
    external_rule:
      text: "LR 12/2005 art. 57 (componente geologica del PGT); the NTA itself cites LR 12/2005 art. 8 c.1 c. and art. 10 c.1 d. in art. 42."
      external: true
      verify: true
    note: "The class decides what building and basement works are allowed and which geological/hydraulic studies are needed."
